name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The games live in their own repositories, so a push here is not the only
  # thing that should refresh the site. Rather than have each game repo hold a
  # token to poke this one, this workflow polls: the deployed site records the
  # commits it was built from, and the check job below compares them. Public
  # repos are readable without credentials, so no secret exists anywhere.
  #
  # Once a day is the cadence; use "Run workflow" in the Actions tab to pick up
  # a game change immediately. Deliberately off the hour, since GitHub throttles
  # scheduled runs hardest there.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight. With a 15-minute schedule, cancel-in-progress
# would let a routine tick kill a deploy triggered by a push; queueing is the
# right trade for a job whose last step publishes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Cheap no-credential poll, schedule only: roughly ten seconds, so a day with
  # no game changes costs that instead of a full rebuild of three games.
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      fingerprint: ${{ steps.compare.outputs.want }}
    steps:
      - uses: actions/checkout@v4
      - id: compare
        run: |
          set -euo pipefail
          want="${{ github.sha }}"
          while read -r slug repo ref; do
            [ -n "$slug" ] || continue
            sha=$(git ls-remote "https://github.com/$repo.git" "$ref" | cut -f1 | head -1)
            [ -n "$sha" ] || { echo "::error::could not resolve $repo@$ref"; exit 1; }
            want="$want-$sha"
          done < <(node -pe 'require("./games.json").map(g=>[g.slug,g.repo,g.ref].join(" ")).join("\n")')

          have=$(curl -fsS --max-time 20 https://dandoku.com/build-info.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).fingerprint||""))}catch{process.stdout.write("")}})' 2>/dev/null || true)

          echo "want: $want"
          echo "have: ${have:-<none>}"
          echo "want=$want" >> "$GITHUB_OUTPUT"
          if [ "$want" = "$have" ]; then
            echo "Nothing changed; skipping deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    # check only runs on a schedule, so it is skipped for pushes and manual
    # runs - !cancelled() lets this run anyway, while a genuine check failure
    # leaves changed empty and holds the deploy back.
    if: |
      !cancelled() &&
      (github.event_name != 'schedule' || needs.check.outputs.changed == 'true')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # games.json is the single source of truth for which games are deployed
      # and where. Cloning from it here, rather than hardcoding repositories in
      # this file, is what keeps the site's links, the assembled directories and
      # the change poll from drifting apart.
      - name: Clone the games
        run: |
          set -euo pipefail
          while read -r slug repo ref; do
            [ -n "$slug" ] || continue
            echo "cloning $repo@$ref -> games/$slug"
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "games/$slug"
          done < <(node -pe 'require("./games.json").map(g=>[g.slug,g.repo,g.ref].join(" ")).join("\n")')

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            games/*/package-lock.json

      - run: npm ci
      - run: npm run lint
      # The test suite renders the built worker, so it has to run after the build.
      - run: npm run build
      - run: npm test
      # Build the snapshot here rather than deploying whatever happens to be
      # committed. This step wipes and recreates static-site/, so the games must
      # be assembled after it, not before.
      - run: npm run build:pages

      - name: Assemble the games into the site
        run: |
          set -euo pipefail
          for slug in $(node -pe 'require("./games.json").map(g=>g.slug).join(" ")'); do
            echo "::group::$slug"
            ( cd "games/$slug" && npm ci && npm run build )
            cp -r "games/$slug/dist" "static-site/$slug"
            test -f "static-site/$slug/index.html" || { echo "::error::$slug produced no index.html"; exit 1; }
            echo "assembled /$slug/"
            echo "::endgroup::"
          done

      # Every game builds with Vite base './', so its assets are relative and
      # work from any sub-path. If that ever changes, the game would request
      # assets from the domain root and silently 404 - the same failure that
      # took the homepage down - so fail the build instead of shipping it.
      - name: Verify the games are sub-path safe
        run: |
          set -euo pipefail
          fail=0
          for slug in $(node -pe 'require("./games.json").map(g=>g.slug).join(" ")'); do
            if grep -qE '(src|href)="/[^"]' "static-site/$slug/index.html"; then
              echo "::error::/$slug/ references root-absolute assets and will 404 under a sub-path"
              grep -oE '(src|href)="/[^"]*"' "static-site/$slug/index.html" | head -5
              fail=1
            fi
          done
          exit $fail

      # Publish what this build came from, so the poll above can tell whether a
      # later run has anything to do. This is what replaces a dispatch token.
      - name: Record build provenance
        run: |
          set -euo pipefail
          node scripts/write-build-info.mjs
          built=$(node -pe 'JSON.parse(require("fs").readFileSync("static-site/build-info.json","utf8")).fingerprint')
          expected="${{ needs.check.outputs.fingerprint }}"
          if [ -n "$expected" ] && [ "$built" != "$expected" ]; then
            echo "::warning::fingerprint differs from the poll expectation (a game moved mid-build); next tick will rebuild"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static-site
      - id: deployment
        uses: actions/deploy-pages@v4
