name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The games live in their own repositories, so a push here is not the only
  # thing that should refresh the site. Rather than have each game repo hold a
  # token to poke this one, this workflow polls: the deployed site records the
  # commits it was built from, and the check job below compares them. Public
  # repos are readable without credentials, so no secrets exist anywhere.
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SUDOKU_REPO: THRD-GH/SodukuCombined
  KILLER_REPO: THRD-GH/KillerSoduku
  SOLDUKU_REPO: THRD-GH/Solduku

jobs:
  # Cheap no-credential poll: roughly ten seconds, and on a quiet schedule tick
  # it skips the deploy entirely rather than rebuilding three games for nothing.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      fingerprint: ${{ steps.compare.outputs.want }}
    steps:
      - id: compare
        run: |
          set -euo pipefail
          head_of() { git ls-remote "https://github.com/$1.git" HEAD | cut -f1; }
          want="${{ github.sha }}-$(head_of "$SUDOKU_REPO")-$(head_of "$KILLER_REPO")-$(head_of "$SOLDUKU_REPO")"

          # The live site publishes its own provenance. If it is unreachable or
          # predates this file, treat it as changed and rebuild.
          have=$(curl -fsS --max-time 20 https://dandoku.com/build-info.json 2>/dev/null \
                 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).fingerprint||""))}catch{process.stdout.write("")}})' 2>/dev/null || true)

          echo "want: $want"
          echo "have: ${have:-<none>}"
          echo "want=$want" >> "$GITHUB_OUTPUT"
          if [ "$want" = "$have" ]; then
            echo "Nothing changed; skipping deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    # A schedule tick only deploys when something actually moved. Pushes and
    # manual runs always deploy.
    if: github.event_name != 'schedule' || needs.check.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Check the games out before setup-node so their lockfiles are visible to
      # the dependency cache.
      - uses: actions/checkout@v4
        with: { repository: THRD-GH/SodukuCombined, path: games/sudoku }
      - uses: actions/checkout@v4
        with: { repository: THRD-GH/KillerSoduku, path: games/killer }
      - uses: actions/checkout@v4
        with: { repository: THRD-GH/Solduku, path: games/solduku }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            games/*/package-lock.json

      - run: npm ci
      - run: npm run lint
      # The test suite renders the built worker, so it has to run after the build.
      - run: npm run build
      - run: npm test
      # Build the snapshot here rather than deploying whatever happens to be
      # committed. This step wipes and recreates static-site/, so the games must
      # be assembled after it, not before.
      - run: npm run build:pages

      - name: Assemble the games into the site
        run: |
          set -euo pipefail
          for slug in sudoku killer solduku; do
            echo "::group::$slug"
            ( cd "games/$slug" && npm ci && npm run build )
            cp -r "games/$slug/dist" "static-site/$slug"
            test -f "static-site/$slug/index.html" || { echo "$slug produced no index.html"; exit 1; }
            echo "assembled /$slug/"
            echo "::endgroup::"
          done

      # Every game builds with Vite `base: './'`, so its assets are relative and
      # work from any sub-path. If that ever changes, the game would request
      # assets from the domain root and silently 404 — the same failure that
      # took the homepage down — so fail the build instead of shipping it.
      - name: Verify the games are sub-path safe
        run: |
          set -euo pipefail
          fail=0
          for slug in sudoku killer solduku; do
            if grep -qE '(src|href)="/[^"]' "static-site/$slug/index.html"; then
              echo "::error::/$slug/ references root-absolute assets and will 404 under a sub-path"
              grep -oE '(src|href)="/[^"]*"' "static-site/$slug/index.html" | head -5
              fail=1
            fi
          done
          exit $fail

      # Publish what this build came from, so the poll above can tell whether a
      # later run has anything to do. This is what replaces a dispatch token.
      - name: Record build provenance
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const { execSync } = require("node:child_process");
            const head = (dir) => execSync("git rev-parse HEAD", { cwd: dir }).toString().trim();
            const games = { sudoku: head("games/sudoku"), killer: head("games/killer"), solduku: head("games/solduku") };
            const info = {
              site: process.env.GITHUB_SHA,
              games,
              fingerprint: [process.env.GITHUB_SHA, games.sudoku, games.killer, games.solduku].join("-"),
              builtAt: new Date().toISOString(),
            };
            fs.writeFileSync("static-site/build-info.json", JSON.stringify(info, null, 2) + "\n");
            console.log(info.fingerprint);
          '
          # The poll compares against this exact value; a mismatch here would
          # make every scheduled run rebuild forever.
          built=$(node -pe 'JSON.parse(require("fs").readFileSync("static-site/build-info.json","utf8")).fingerprint')
          if [ "$built" != "${{ needs.check.outputs.fingerprint }}" ]; then
            echo "::warning::fingerprint differs from the poll's expectation (a game moved mid-build); next tick will rebuild"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static-site
      - id: deployment
        uses: actions/deploy-pages@v4
